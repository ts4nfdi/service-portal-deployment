{{- if .Values.ingress.dns }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-service-portal-ingress-incubators-api
  annotations:
    {{ if .Values.ingress.enableSSL }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/issuer: {{ .Values.ingress.certIssuer | quote}}
    {{ end }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: 12k
spec:
  ingressClassName: "nginx"
  {{ if .Values.ingress.enableSSL }}
  tls:
    - hosts:
        - {{ .Values.ingress.dns }}
      secretName: {{ .Release.Name }}-ssl-secret
  {{ end }}
  rules:
      - host: {{ .Values.ingress.dns }}
        http:
          paths:
            - path: /api-gateway/incubators
              pathType: Prefix
              backend:
                service:
                  name: {{ .Release.Name }}-ui
                  port:
                    number: 3000
  {{- end }}
